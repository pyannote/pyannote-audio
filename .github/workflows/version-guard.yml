name: Version Guard

on:
  workflow_call:
    inputs:
      release-tag:
        description: Release tag expected to match the package version
        required: true
        type: string

permissions:
  contents: read

jobs:
  not-already-published:
    name: all-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Validate all package versions and PyPI artifacts
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: uv run --no-project --with packaging python -m scripts.release --tag "$RELEASE_TAG" --check-pypi
