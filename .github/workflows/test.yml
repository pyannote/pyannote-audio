name: Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.scope }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      PYANNOTE_METRICS_ENABLED: "0"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: ${{ matrix.scope == 'network' && '0' || '1' }}
      OMP_NUM_THREADS: "2"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python-version: "3.11", scope: all}
          - {python-version: "3.12", scope: all}
          - {python-version: "3.13", scope: all}
          - {python-version: "3.14", scope: all}
          - {python-version: "3.15", scope: libraries}
          - {python-version: "3.x", scope: libraries}
          - {python-version: "3.11", scope: optional}
          - {python-version: "3.11", scope: network}
          - {python-version: "3.11", scope: separation}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Install FFmpeg
        if: matrix.scope != 'libraries'
        # TorchCodec needs FFmpeg's shared libraries, but not recommended extras.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install the built wheels together
        run: |
          uv venv --python "${{ steps.python.outputs.python-path }}"
          uv run --no-project --python .venv/bin/python python -m scripts.install_wheels --scope "${{ matrix.scope }}" --cpu
      - name: Test the installed distributions
        run: uv run --no-project --python .venv/bin/python python -m scripts.test_packages --scope "${{ matrix.scope }}"
