name: Test

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
      - master
      - release/*


jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check that inference does not need the optional dependencies
        # --exact removes everything the extras would add (matplotlib among them),
        # so this is the environment of a plain `pip install pyannote.audio`.
        run: uv run --exact python -c "from pyannote.audio import Pipeline"

      - name: Run tests
        run: uv run --extra test pytest
