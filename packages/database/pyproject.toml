[project]
name = "pyannote-database"
description = "Interface to multimedia databases and experimental protocols"
readme = "README.md"
authors = [
    { name = "Hervé BREDIN", email = "herve@pyannote.ai" }
]
requires-python = ">=3.11"

dynamic = [
  "version",
]

dependencies = [
    "pandas>=2.2.3",
    "pyannote-core>=7.0.0.dev0,<8",
    "pyyaml>=6.0.2",
]

[project.scripts]
pyannote-database = "pyannote.database.cli:main"

[project.entry-points.'pyannote.database.loader']
".rttm" = "pyannote.database.loader:RTTMLoader"
".uem" = "pyannote.database.loader:UEMLoader"
".map" = "pyannote.database.loader:MAPLoader"
".lab" = "pyannote.database.loader:LABLoader"
".stm" = "pyannote.database.loader:STMLoader"

[project.optional-dependencies]
cli = [
    "typer>=0.15.1",
]
test = [
    "pytest>=8.3.4",
]
doc = [
    "sphinx-rtd-theme>=3.0.2",
    "sphinx>=8.1.3",
]
transcription = [
    "meeteval>=0.4.3",
]

[build-system]
requires = ["hatchling==1.32.0", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"


[tool.hatch.version.raw-options]
# Ignore pre-monorepo tags: all distributions share tags starting at 7.0.0.
search_parent_directories = true
fallback_version = "7.0.0.dev0"
git_describe_command = [
    "git", "describe", "--dirty", "--tags", "--long",
    "--match", "[0-9]*", "--match", "v[0-9]*",
    "--exclude", "[0-6].*", "--exclude", "v[0-6].*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyannote"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/doc", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]
