name: CI

on:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# lint (PR only)
# build ──┬──► test ──────────┬──► publish (release only)
#         └──► version-guard ─┘
# ci-complete collects all required results.

jobs:
  lint:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/lint.yml

  build:
    uses: ./.github/workflows/build-wheels.yml
    with:
      release-tag: ${{ github.event.release.tag_name || '' }}

  test:
    needs: build
    uses: ./.github/workflows/test.yml

  version-guard:
    name: versions
    if: github.event_name == 'release'
    needs: build
    uses: ./.github/workflows/version-guard.yml
    with:
      release-tag: ${{ github.event.release.tag_name }}

  # PyPI trusted publishing must run in a top-level workflow.
  publish:
    if: github.event_name == 'release'
    needs: [build, test, version-guard]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyannote-core/
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Upload distributions to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Upload to PyPI
        run: >-
          uv publish --trusted-publishing always
          --publish-url https://upload.pypi.org/legacy/
          --check-url https://pypi.org/simple/

  ci-complete:
    if: always()
    needs: [lint, build, test, version-guard, publish]
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Check results
        run: |
          for result in $RESULTS; do
            if [[ "$result" == failure || "$result" == cancelled ]]; then
              echo "::error::Required job finished with result: $result"
              exit 1
            fi
          done
