[project]
name = "pyannote-core"
description = "Advanced data structures for handling temporal segments with attached labels"
readme = "README.md"
authors = [
    { name = "Hervé BREDIN", email = "herve@pyannote.ai" }
]
requires-python = ">=3.11"

dynamic = [
  "version",
]

dependencies = [
    "numpy>=2.0",
    "pandas>=2.2.3",
    "sortedcontainers>=2.4.0",
]

[project.optional-dependencies]
notebook = [
    "ipython>=8.31.0",
    "matplotlib>=3.10.0",
]
test = [
    "matplotlib>=3.10.0",
    "pytest>=8.3.4",
    "scipy>=1.15.1",
]
doc = [
    "sphinx-rtd-theme>=3.0.2",
    "sphinx>=8.1.3",
    "matplotlib>=3.10.0",
    "ipython>=8.32.0",
]

[build-system]
requires = ["hatchling==1.32.0", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"


[tool.hatch.version.raw-options]
# Ignore pre-monorepo tags: all distributions share tags starting at 7.0.0.
search_parent_directories = true
fallback_version = "7.0.0.dev0"
git_describe_command = [
    "git", "describe", "--dirty", "--tags", "--long",
    "--match", "[0-9]*", "--match", "v[0-9]*",
    "--exclude", "[0-6].*", "--exclude", "v[0-6].*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyannote"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/doc", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]
