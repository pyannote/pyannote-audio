[project]
name = "pyannote-pipeline"
dynamic = ["version"]
description = "Tunable pipelines"
readme = "README.md"
authors = [
    { name = "Hervé BREDIN", email = "herve@pyannote.ai" }
]
requires-python = ">=3.11"

dependencies = [
    "filelock>=3.17.0",
    "optuna>=5.0.0",
    "pyannote-core>=7.0.0.dev0,<8",
    "pyannote-database>=7.0.0.dev0,<8",
    "pyyaml>=6.0.2",
    "scipy>=1.15.1",
    "tqdm>=4.67.1",
]

[project.scripts]
pyannote-pipeline = "pyannote.pipeline.experiment:main"


[project.optional-dependencies]
test = [
    "pytest>=8.3.4",
]
doc = [
    "sphinx-rtd-theme>=3.0.2",
    "sphinx>=8.1.3",
]
cli = [
    "docopt>=0.6.2",
]

[build-system]
requires = ["hatchling==1.32.0", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"


[tool.hatch.version.raw-options]
# Ignore pre-monorepo tags: all distributions share tags starting at 7.0.0.
search_parent_directories = true
fallback_version = "7.0.0.dev0"
git_describe_command = [
    "git", "describe", "--dirty", "--tags", "--long",
    "--match", "[0-9]*", "--match", "v[0-9]*",
    "--exclude", "[0-6].*", "--exclude", "v[0-6].*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyannote"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/doc", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]
