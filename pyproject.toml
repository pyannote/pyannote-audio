[project]
name = "pyannote-audio"
description = "State-of-the-art speaker diarization toolkit"
readme = "README.md"
license = "MIT"
authors = [{ name = "Hervé BREDIN", email = "herve@pyannote.ai" }]
requires-python = ">=3.11"

dynamic = ["version"]

dependencies = [
    "asteroid-filterbanks>=0.4.0",
    "einops>=0.8.1",
    "huggingface-hub>=0.28.1",
    "lightning>=2.4",
    "opentelemetry-api>=1.34.0",
    "opentelemetry-sdk>=1.34.0",
    "opentelemetry-exporter-otlp>=1.34.0",
    "pyannote-core>=6.0.1",
    "pyannote-database>=6.1.1",
    "pyannote-metrics>=4.0.0",
    "pyannote-pipeline",
    "pytorch-metric-learning>=2.8.1",
    "rich>=13.9.4",
    "safetensors>=0.5.2",
    "torch-audiomentations>=0.12.0",
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "torchcodec>=0.7.0",
    "torchmetrics>=1.6.1",
    "matplotlib>=3.11.0",
    "pyannoteai-sdk>=0.3.0",
]

[tool.uv.sources]
pyannote-pipeline = { git = "https://github.com/pyannote/pyannote-pipeline", rev = "feat/multi-objective" }

[project.scripts]
pyannote-audio = "pyannote.audio.__main__:app"

[project.optional-dependencies]
test = ["papermill>=2.6.0", "pytest>=8.3.4"]
doc = ["sphinx-rtd-theme>=3.0.2", "sphinx>=8.1.3"]
cli = ["typer>=0.15.1"]
separation = ["asteroid>=0.5.2", "transformers>=4.48.3"]
dev = ["ipython>=8.32.0"]

[build-system]
requires = ["hatchling==1.32.0", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/pyannote"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/doc", "/README.md", "/CHANGELOG.md", "/LICENSE",
    "/pyproject.toml",
]

[dependency-groups]
dev = ["ipykernel>=6.29.5"]

[tool.pytest.ini_options]
markers = [
    "network: downloads public models from Hugging Face",
    "notebook: executes historical tutorial notebooks (opt in explicitly)",
]
addopts = "-m 'not notebook'"

[tool.ruff]
target-version = "py311"
# Historical notebooks target older APIs and are maintained separately.
extend-exclude = ["*.ipynb", "tutorials/AMI-diarization-setup"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
# Imports intentionally follow version initialization or notebook setup.
# Preserve existing enum string behavior and mathematical variable names.
ignore = ["E402", "E741", "UP042"]
